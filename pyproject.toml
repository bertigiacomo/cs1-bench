[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs1-bench"
version = "0.1.2"
description = "Classification System One Benchmark: LLMs on typed, Jev-style semantic decisions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# Torch is platform-specific (CUDA 13 on the DGX Spark, MPS on macOS), so it lives in the
# "torch" extra: preinstalled builds stay untouched, and every run manifest records the exact version.
dependencies = [
  "transformers>=4.57,<6",  # any version that knows your models; each manifest records the one used
  "accelerate>=1.0",        # device_map loading
  "sentencepiece",          # tokenizers of some model families
  "protobuf",
]

[project.scripts]
cs1 = "cs1_bench.__main__:main"

[project.optional-dependencies]
torch = ["torch==2.10.0"]
test = ["pytest==8.4.2"]
llamacpp = ["llama-cpp-python==0.3.35"]
transformers4 = ["transformers==4.57.1"]  # for models whose own code needs it (e.g. Spark-X2.5)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cs1_bench = ["smoke.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
