[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs1-bench"
version = "0.1.0"
description = "Classification System One Benchmark: LLMs on typed, Jev-style semantic decisions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# Torch is platform-specific (CUDA 13 on the DGX Spark, MPS on macOS), so it lives in the
# "torch" extra: preinstalled builds stay untouched, and every run manifest records the exact version.
dependencies = [
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "numpy==2.2.6",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
]

[project.scripts]
cs1 = "cs1_bench.__main__:main"

[project.optional-dependencies]
torch = ["torch==2.10.0"]
test = ["pytest==8.4.2"]
llamacpp = ["llama-cpp-python==0.3.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cs1_bench = ["smoke.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
